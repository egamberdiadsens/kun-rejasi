name: APK yig'ish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalar
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Android loyihani yaratish
        run: |
          npx cap add android
          python scripts/icons.py
          npx cap sync android

      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nom berish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KunRejasi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KunRejasi-apk
          path: KunRejasi.apk

      - name: Releases bo'limiga qo'yish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kun Rejasi v1.0.${{ github.run_number }}
          files: KunRejasi.apk
